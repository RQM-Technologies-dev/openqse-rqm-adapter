[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqm-openqse-adapter"
version = "0.2.0"
description = "Experimental OpenQSE-facing adapter for the RQM quantum compiler ecosystem"
authors = [{ name = "RQM Technologies" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["quantum", "compiler", "adapter", "openqse", "quaternion", "rqm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Install sibling RQM packages from their repositories/editable worktrees for
# the full ecosystem demonstration. They are kept out of base PyPI resolution
# until package distribution/version coordination is finalized.
ecosystem = ["pytest>=7.0"]

[project.scripts]
rqm-openqse-demo = "rqm_openqse_adapter.cli:main"

[project.urls]
"Homepage" = "https://github.com/RQM-Technologies-dev/openqse-rqm-adapter"
"Source" = "https://github.com/RQM-Technologies-dev/openqse-rqm-adapter"
"RQM Core" = "https://github.com/RQM-Technologies-dev/rqm-core"
"RQM Circuits" = "https://github.com/RQM-Technologies-dev/rqm-circuits"
"RQM Compiler" = "https://github.com/RQM-Technologies-dev/rqm-compiler"
"RQM Entanglement" = "https://github.com/RQM-Technologies-dev/rqm-entanglement"
"RQM Qiskit" = "https://github.com/RQM-Technologies-dev/rqm-qiskit"
"RQM Optimize" = "https://github.com/RQM-Technologies-dev/rqm-optimize"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rqm_openqse_adapter = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
